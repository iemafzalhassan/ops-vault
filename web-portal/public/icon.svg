  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bgGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#borderGradient)" stroke-width="8"/>
  <circle cx="390" cy="120" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="390" cy="120" r="8" fill="#ecfdf5"/>
  <path d="M 140 180 L 250 256 L 140 332" fill="none" stroke="url(#promptGradient)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="280" y1="332" x2="375" y2="332" stroke="url(#promptGradient)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>
</svg>
