apiVersion: batch/v1
kind: CronJob
metadata:
  name: persistent-volume-log-cleaner
  namespace: production
  labels:
    app.kubernetes.io/name: log-cleaner
    app.kubernetes.io/part-of: opsvault-platform-ops
spec:
  # Schedule: Runs every night at 02:00 UTC (Minute Hour Day Month DayOfWeek)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: log-cleaner
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: log-cleaner
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date)] Starting Kubernetes CronJob Volume Maintenance..."
                  # Delete compressed logs older than 7 days
                  find /mnt/data/logs -type f -name "*.gz" -mtime +7 -exec rm -f {} +
                  # Gzip raw logs older than 1 day
                  find /mnt/data/logs -type f -name "*.log" -mtime +1 -exec gzip -f {} +
                  echo "[$(date)] Maintenance complete."
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: app-log-storage
                  mountPath: /mnt/data/logs
          volumes:
            - name: app-log-storage
              persistentVolumeClaim:
                claimName: shared-app-logs-pvc
