name: 🚀 Propose a New Script
description: Submit an idea for a production script or automation utility
title: "[SCRIPT]: <Short Descriptive Title>"
labels: ["new script", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to OpsVault! Please outline the use case and real-world enterprise scenario.
  - type: dropdown
    id: role
    attributes:
      label: Target Engineering Role
      options:
        - SRE (Site Reliability Engineering)
        - DevOps Engineer
        - Platform Ops / Kubernetes
        - Cloud / Support Engineer
        - DevRel / Developer Experience
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Implementation Language
      options:
        - Bash / POSIX Shell
        - Python
        - Go (Golang)
        - Kubernetes YAML & CronJob
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Real-World Enterprise Scenario
      description: What production issue, incident, or manual toil does this script solve?
      placeholder: e.g. Disk fills up unexpectedly at 3 AM due to unrotated application logs...
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Key Tools & Libraries Used
      description: List the core utilities or libraries (e.g. jq, curl, boto3, kubectl, openssl).
    validations:
      required: false
